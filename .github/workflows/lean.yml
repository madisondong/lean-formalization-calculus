name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Reclaim unused SDKs on the ephemeral hosted runner
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" || "${RUNNER_OS:-}" != "Linux" ]]; then
            echo "SDK cleanup is restricted to a GitHub-hosted Linux runner" >&2
            exit 1
          fi
          echo "DISK_BEFORE_SDK_CLEANUP"
          df -h / "$GITHUB_WORKSPACE"
          sudo du -sh /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf --one-file-system -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          echo "DISK_AFTER_SDK_CLEANUP"
          df -h / "$GITHUB_WORKSPACE"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate committed dependency pins
        run: python3 scripts/check_project.py --locks-only
      - name: Require disk headroom before Lean cache
        shell: bash
        run: |
          set -euo pipefail
          df -h / "$GITHUB_WORKSPACE"
          available_kib=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')
          required_kib=$((30 * 1024 * 1024))
          echo "DISK_PREFLIGHT_LEAN available_kib=$available_kib minimum_kib=$required_kib"
          if (( available_kib < required_kib )); then
            echo "Less than 30 GiB available before Lean cache; use a runner with more disk" >&2
            exit 1
          fi
      - name: Install Lean and fetch the pinned mathlib cache
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1 inspected 2026-10-10
        with:
          auto-config: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'true'
          build: 'false'
          test: 'false'
          lint: 'false'
      - name: Verify library and allowed axioms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/verification
          ci_log=$(mktemp .lake/verification/ci-check.XXXXXXXX)
          bash scripts/check.sh 2>&1 | tee "$ci_log"
      - name: Report final disk usage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "DISK_FINAL"
          df -h / "$GITHUB_WORKSPACE"
          df -i / "$GITHUB_WORKSPACE"
          if [[ -d .lake ]]; then du -sh .lake; fi
